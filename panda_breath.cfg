#####################################################################
#   BIQU Panda Breath -- chamber heater/filter integration
#####################################################################
# Uses justinh-rahb/pandabreath-klipper (a klippy extras module, not a
# Klipper-bundled one): https://github.com/justinh-rahb/pandabreath-klipper
#
# This module is NOT part of stock Klipper -- before this section will load,
# panda_breath.py must be copied onto the Klipper host itself, e.g.:
#   cp panda_breath.py ~/klipper/klippy/extras/
#   sudo systemctl restart klipper
# (or run that repo's install.sh, which does this plus generates this file --
# that's how this file and the M141/M191 macros below actually got here).
# See its docs/klipper/install.md for details.
#
# It talks to the Panda Breath over its stock WiFi firmware (a LAN-only,
# unauthenticated WebSocket) -- update `host` below to the device's actual
# hostname/IP if PandaBreath.local doesn't resolve on this host. OEM firmware
# 1.0.3+ is required for the Klipper printer-binding path.
[panda_breath]
firmware: stock
host: PandaBreath.local
port: 80

# The module registers a "panda_breath" custom sensor type and virtual PWM
# pin, but (deliberately) doesn't create the heater itself -- this is a
# normal heater_generic, controlled the normal Klipper way
# (SET_HEATER_TEMPERATURE HEATER=panda_breath TARGET=...), same as PRINT_START
# does below for the chamber. TURN_OFF_HEATERS (already called in PRINT_END)
# turns this off along with the bed/extruder heaters -- no extra wiring needed.
[heater_generic panda_breath]
heater_pin: panda_breath:pwm
sensor_type: panda_breath
control: watermark
max_delta: 0.5
min_temp: 15
max_temp: 80

[verify_heater panda_breath]
# A chamber heats much more slowly than a hotend. Allow fifteen minutes for a
# small measured rise before treating it as a failed heater, while retaining
# the independent 80C hard limit in [heater_generic panda_breath].
max_error: 1800
check_gain_time: 900
hysteresis: 5
heating_gain: 0.5

# M141/M191 compatibility macros (installed by install.sh by default) --
# not used by this repo's own PRINT_START (which calls SET_HEATER_TEMPERATURE/
# TEMPERATURE_WAIT on panda_breath directly), but kept for any slicer or
# manual g-code that emits M141/M191 instead. PANDA_BREATH_AUTO is the
# stock-firmware-only native auto/hold mode this module also exposes.
[gcode_macro M141]
description: Set chamber temperature (heat with Klipper, hold/cool with Panda auto)
gcode:
    {% set s = params.S|default(0)|float %}
    {% set current = printer["heater_generic panda_breath"].temperature|float %}
    {% set tolerance = 0.5 %}
    {% set filtertemp = params.FILTERTEMP|default(30)|int %}
    {% set hotbedtemp = params.HOTBEDTEMP|default(80)|int %}
    {% if s <= 0 %}
        PANDA_BREATH_AUTO ENABLE=0
        SET_HEATER_TEMPERATURE HEATER="panda_breath" TARGET=0
    {% elif s > (current + tolerance) %}
        SET_HEATER_TEMPERATURE HEATER="panda_breath" TARGET={s}
    {% else %}
        PANDA_BREATH_AUTO ENABLE=1 TARGET={s} FILTERTEMP={filtertemp} HOTBEDTEMP={hotbedtemp}
    {% endif %}

[gcode_macro M191]
description: Reach and hold chamber temperature
gcode:
    {% set s = params.S|default(0)|float %}
    {% set current = printer["heater_generic panda_breath"].temperature|float %}
    {% set tolerance = 0.5 %}
    {% set filtertemp = params.FILTERTEMP|default(30)|int %}
    {% set hotbedtemp = params.HOTBEDTEMP|default(80)|int %}
    {% if s <= 0 %}
        M141 S0
    {% elif (current + tolerance) < s %}
        SET_HEATER_TEMPERATURE HEATER="panda_breath" TARGET={s}
        TEMPERATURE_WAIT SENSOR="heater_generic panda_breath" MINIMUM={s}
        PANDA_BREATH_AUTO ENABLE=1 TARGET={s} FILTERTEMP={filtertemp} HOTBEDTEMP={hotbedtemp}
    {% else %}
        PANDA_BREATH_AUTO ENABLE=1 TARGET={s} FILTERTEMP={filtertemp} HOTBEDTEMP={hotbedtemp}
        TEMPERATURE_WAIT SENSOR="heater_generic panda_breath" MAXIMUM={s + tolerance}
    {% endif %}
