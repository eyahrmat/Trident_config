#####################################################################
#   Toolhead 1 hardware -- dedicated board (same model as nhk)
#####################################################################
# Mirrors nhk's (Nitehawk 36) pin layout on a second, physical board.
# Differences from T0: ATC Semitec 104NT-4-R025H42G thermistor (T0 uses
# PT1000) and a Galileo 2 extruder (T0 uses a BMG/Clockwork2-style setup).
#
# NOTE: this targets the current (main branch) klipper-toolchanger API --
# do not copy the old [gcode_macro T1]/_CHANGE_TOOL/[tool_probe T1] pattern
# from the original r2pdx_config-micron example; T0's tool_0.cfg (and this
# file's tool_1.cfg counterpart) already moved off that. See toolchanger.cfg's
# header comment for why.

[mcu nhk1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3434343339125509-if00
restart_method: command

#####################################################################
#   Extruder
#####################################################################

[extruder1]
step_pin: nhk1:gpio23
dir_pin: !nhk1:gpio24
enable_pin: !nhk1:gpio25
## Galileo 2 -- values as given; verify with an extrude-100mm test.
rotation_distance: 47.088
gear_ratio: 9:1
## Microsteps/full_steps_per_rotation copied from T0's convention (1.8 degree
## stepper) -- confirm these actually match the Galileo 2's motor.
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nhk1:gpio9
## ATC Semitec 104NT-4-R025H42G -- differs from T0's PT1000.
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk1:gpio29
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
max_extrude_only_velocity: 25
max_extrude_only_distance: 150
control: pid
pid_kp: 30.539
pid_ki: 6.567
pid_kd: 35.502

[tmc2209 extruder1]
uart_pin: nhk1:gpio0
tx_pin: nhk1:gpio1
interpolate: false
run_current: 0.6  # starting point matching T0 -- verify for the Galileo 2's motor
sense_resistor: 0.100
stealthchop_threshold: 0

#####################################################################
#   Fan Control
#####################################################################

[fan_generic part_fan_t1]
##  Print Cooling Fan (T1 part cooling; named for the toolchanger's M106/M107)
pin: nhk1:gpio6
#tachometer_pin: nhk1:gpio17
#tachometer_ppr: 2
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan1]
##  Hotend Fan
pin: nhk1:gpio5
tachometer_pin: nhk1:gpio16
tachometer_ppr: 2
max_power: 1.0
kick_start_time: 0.5
heater: extruder1
heater_temp: 50.0

#####################################################################
#   Toolhead 1 status LED / onboard LED
#####################################################################

[output_pin pcb_led1]
pin: !nhk1:gpio8

[neopixel th_leds_t1]
pin: nhk1:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0

#####################################################################
#   Accelerometer
#####################################################################
# Not wired into [resonance_tester] (that stays on Beacon's own accel_chip,
# same as T0) -- available for MEASURE_AXES_NOISE / manual queries, and as
# the CHIP= target when you run SHAPER_CALIBRATE for T1 specifically.

[adxl345 nhk1]
cs_pin: nhk1:gpio27
spi_software_sclk_pin: nhk1:gpio18
spi_software_mosi_pin: nhk1:gpio20
spi_software_miso_pin: nhk1:gpio19
