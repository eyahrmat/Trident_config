#####################################################################
#   Tool 1 - Toolchanger definition
#####################################################################
# T1 runs on its own dedicated board (nhk1), mirroring nhk's pin layout --
# see [extruder1], [tmc2209 extruder1], [fan_generic part_fan_t1],
# [heater_fan hotend_fan1], and [neopixel th_leds_t1] in
# klipper-toolchanger/toolboard_1.cfg for the underlying hardware.

[tool T1]
tool_number: 1
extruder: extruder1
fan: part_fan_t1
## Maxwell coupling: tool-attach detection, same polarity caveat as T0 --
## verify once Klipper starts; add ^ or ! if it reads backwards.
detection_pin: nhk1:gpio13
## Offsets are handled by the tool change macro; keep these at 0.
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0

## Docking parameters -- measured on this printer's actual dock. Y stops
## (safe_toolhead_y/safe_shuttle_y/close_y/attach_y) are inherited from
## [toolchanger] since T1's dock shares the same Y geometry as T0's.
## Verify with a reduced-speed TEST_TOOL_DOCKING before running at full
## params_fast_speed/params_path_speed or calling DOCK_SEQUENCE.
params_park_x: 86    # X position with the toolhead screws fully within the docking slots.
params_detach_x: 91  # X position with the toolhead screws safely outside of the docking slots.

## Input shaper -- not set. Even with T1's extruder now matching T0's,
## other differences (mounting, wiring, fans/LEDs) could still shift its
## resonance, so T0's calibrated values aren't assumed to carry over. Run
## SHAPER_CALIBRATE CHIP="adxl345 nhk1" once T1 is up, then add
## params_input_shaper_type_x/y and params_input_shaper_freq_x/y here,
## matching tool_0.cfg's pattern. Until then, after_change_gcode's
## SET_INPUT_SHAPER call is skipped for T1 (it's guarded on these being set).
