#####################################################################
#   Toolhead 0 hardware -- dedicated board (nhk / Nitehawk 36)
#####################################################################
# T0's MCU, extruder, fans, LEDs, and accelerometer -- mirrors the
# structure of toolboard_1.cfg.
#
# IMPORTANT ASYMMETRY: Klipper requires extruders defined contiguously
# starting from [extruder] -- [extruder1] (T1) is only valid if [extruder]
# (T0, this file) also exists. So while T1 can be fully disabled by
# commenting out both toolboard_1.cfg and tool_1.cfg, T0's hardware
# (this file) must stay included as long as T1 is in use, even if T0
# itself is disabled. To disable T0 alone, comment out only tool_0.cfg
# (the toolchanger registration) and leave this file's include active.

[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_4E363334320E585A-if00
#serial: /dev/serial/by-id/usb-Klipper_rp2040_3434343339125509-if00

restart_method: command
##--------------------------------------------------------------------

#####################################################################
#   Extruder
#####################################################################

##  Connected to STEPPER 0
##  Heater - HEATER
##  Thermistor - TH0
[extruder]
step_pin: nhk:gpio23
dir_pin: nhk:gpio24
enable_pin: !nhk:gpio25
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
rotation_distance: 22.6789511
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
gear_ratio: 50:10              #BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nhk:gpio9
## Hotend replaced to match T1's (Dragon Ace, ATC Semitec 104NT-4-R025H42G) --
## was PT1000. pullup_resistor was already 2200 (board hardware trait, not
## sensor-dependent, so it didn't need to change).
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:gpio29
pullup_resistor: 2200
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
max_extrude_only_velocity: 25
max_extrude_only_distance: 150
control: pid
## PID values carried over from T1 as a starting point, same hotend model --
## re-run PID_CALIBRATE HEATER=extruder for this specific unit when convenient.
pid_kp: 33.539
pid_ki: 4.14
pid_kd: 67.917
##  Try to keep pressure_advance below 1.0
#pressure_advance: 0.05
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040

##  E0 on MOTOR6
##  Connected to STEPPER 4
[tmc2209 extruder]
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 0

#####################################################################
#   Fan Control
#####################################################################

[fan_generic part_fan_t0]
##  Print Cooling Fan - FAN0 (T0 part cooling; named for the toolchanger's M106/M107 overrides)
pin: nhk:gpio6
#tachometer_pin: nhk:gpio17
#tachometer_ppr: 2
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan hotend_fan]
##  Hotend Fan - FAN1
pin: nhk:gpio5
tachometer_pin: nhk:gpio16
tachometer_ppr: 2
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

#####################################################################
#   Toolhead 0 status LED / onboard LED
#####################################################################

## Neopixel (nitehawk sb)
## Connected to led (nitehawk sb)
[output_pin pcb_led]
pin: !nhk:gpio8

## Neopixel (nitehawk sb)
## Connected to NEOPIXEL (nitehawk sb)
## Renamed th_leds_t0 -- doubles as the toolchanger's T0 status LED (stealthburner_macros_tc.cfg)
[neopixel th_leds_t0]
pin: nhk:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0

#####################################################################
#   Accelerometer
#####################################################################
# Not wired into [resonance_tester] (that stays in printer.cfg on Beacon's
# own accel_chip, tool-agnostic) -- available for MEASURE_AXES_NOISE /
# manual queries, and as the CHIP= target when you run SHAPER_CALIBRATE
# for T0 specifically.

[adxl345 nhk]
cs_pin: nhk:gpio27
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19
