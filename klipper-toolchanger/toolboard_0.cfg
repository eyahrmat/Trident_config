#####################################################################
#   Toolhead 0 hardware -- dedicated board (same model as nhk)
#####################################################################
# Mirrors nhk's (Nitehawk 36) pin layout on a second, physical board.
# Hotend/thermistor (Dragon Ace, ATC Semitec 104NT-4-R025H42G) still
# matches T1's -- unaffected by this swap.
#
# Extruder replaced again: was Clockwork 2 / BMG (itself a replacement for
# the original Galileo 2), now an LDO Orbiter v2.5 with the Orbiter Smart
# Sensor (filament presence + tangle/unload) clipped onto it. See the
# [extruder] and new "Filament Sensor" sections below.
#
# NOTE: this targets the current (main branch) klipper-toolchanger API --
# do not copy the old [gcode_macro T0]/_CHANGE_TOOL/[tool_probe T0] pattern
# from the original r2pdx_config-micron example; T1's tool_1.cfg (and this
# file's tool_0.cfg counterpart) already moved off that. See toolchanger.cfg's
# header comment for why.

[mcu nhk1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3434343339125509-if00
restart_method: command

#####################################################################
#   Extruder
#####################################################################

[extruder]
step_pin: nhk1:gpio23
dir_pin: nhk1:gpio24
enable_pin: !nhk1:gpio25
## Extruder replaced with an LDO Orbiter v2.5 -- was a Clockwork 2 / BMG
## (rotation_distance 22.6789511, gear_ratio 50:10).
## Orbiter's internal 7.5:1 planetary reduction is already baked into this
## rotation_distance (LDO's published starting value, ~690 steps/mm @ 16
## microsteps) -- do NOT also set gear_ratio here, or the extruder will try
## to push ~7.5x the intended flow (a known Orbiter 2.0/2.5 config pitfall).
## Re-run the "measure and trim" rotation_distance calibration once running.
rotation_distance: 4.69
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nhk1:gpio9
## ATC Semitec 104NT-4-R025H42G (T1 now uses the same, see toolboard_1.cfg).
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk1:gpio29
## nhk boards have a 2200 ohm pullup on the thermistor ADC pin (see T1's
## [extruder] pullup_resistor -- that's a board hardware trait, not sensor-
## dependent). Omitting this was defaulting to Klipper's 4700 ohm assumption,
## which under-reported temperature.
pullup_resistor: 2200
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
## Orbiter's planetary gearbox pushes noticeably harder than the old BMG
## motor; retain the configured extrusion speed ceiling.
max_extrude_only_velocity: 120
max_extrude_only_distance: 150
control: pid
pid_kp: 32.385
pid_ki: 3.998
pid_kd: 65.58

[tmc2209 extruder]
uart_pin: nhk1:gpio0
tx_pin: nhk1:gpio1
interpolate: false
## LDO's published value for the Orbiter's pancake motor (36STH20-1004AHG,
## 1.2A peak / 0.85A RMS) -- was 0.6 for the old BMG-clone motor.
run_current: 0.85
sense_resistor: 0.100  # board hardware trait, unrelated to the motor swap
stealthchop_threshold: 0

#####################################################################
#   Fan Control
#####################################################################

[fan_generic part_fan_t0]
##  Print Cooling Fan (T0 part cooling; named for the toolchanger's M106/M107)
pin: nhk1:gpio6
#tachometer_pin: nhk1:gpio17
#tachometer_ppr: 2
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
##  Hotend Fan
pin: nhk1:gpio5
tachometer_pin: nhk1:gpio16
tachometer_ppr: 2
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

#####################################################################
#   Toolhead 0 status LED / onboard LED
#####################################################################

[output_pin pcb_led]
pin: !nhk1:gpio8

[neopixel th_leds_t0]
pin: nhk1:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0

#####################################################################
#   Accelerometer
#####################################################################
# Not wired into [resonance_tester] (that stays on Beacon's own accel_chip,
# same as T1) -- available for MEASURE_AXES_NOISE / manual queries, and as
# the CHIP= target when you run SHAPER_CALIBRATE for T0 specifically.

[adxl345 nhk1]
cs_pin: nhk1:gpio27
spi_software_sclk_pin: nhk1:gpio18
spi_software_mosi_pin: nhk1:gpio20
spi_software_miso_pin: nhk1:gpio19

#####################################################################
#   Filament Sensor -- Orbiter Smart Sensor
#####################################################################
# Clips onto the Orbiter v2.5. Two open-drain signals off its connector
# (hence the ^ pullups below), landing on the two spare pins on this board:
#   FS  (filament presence, ball-switch) -> nhk1:gpio3  -- the Nitehawk-36's
#         dedicated filament-sensor input (see MotorDynamicsLab's stock
#         nitehawk-36.cfg); unused elsewhere here.
#   FTU (tangle-detect / unload-button, multiplexed onto one line by the
#         sensor) -> nhk1:gpio10 -- the Nitehawk-36's PROBE input, otherwise
#         idle on this toolhead (Z probing is Beacon, on the main board).
#
# Both only mean anything while T0 is actually the mounted/active tool --
# a docked tool's FS switch has no filament rest on it, and shouldn't pause
# a print being run by the other tool, so both guard on printer["tool T0"].active.

[filament_switch_sensor smart_sensor_t0]
switch_pin: ^nhk1:gpio3
pause_on_runout: False
event_delay: 0.1
pause_delay: 0.1
runout_gcode:
  ORBITER_OSS_RUNOUT_T0
insert_gcode:
  ORBITER_OSS_INSERT_T0

[gcode_button smart_sensor_button_t0]
pin: ^nhk1:gpio10
## LDO multiplexes tangle-detect and the manual unload button onto this one
## FTU line; which it means depends on whether a print is running.
press_gcode: ORBITER_OSS_FTU_T0
