# Adapted from: https://github.com/viesturz/klipper-toolchanger/blob/main/macros.cfg
#
# NOTE: T0/T1 T-commands and M106/M107 are auto-registered by the plugin now
# (T<n> from [tool T0]'s tool_number:, M106/M107 from FanSwitcher since
# [tool T0] sets fan:) -- do not redefine them here, it'll collide with the
# plugin's own gcode.register_command() calls at startup ("already
# registered" errors), the same way [tool_probe T0] collided with Beacon's
# PROBE registration. Only M104/M109 still need a wrapper, since
# SET_TOOL_TEMPERATURE isn't hooked into them automatically.

#####################################################################
#   QUERY_TOOLCHANGER
#####################################################################
# Read-only status check -- safe to run any time, does not touch the
# toolchanger state machine (unlike VERIFY_TOOL_DETECTED).

[gcode_macro QUERY_TOOLCHANGER]
description: Report toolchanger status and each tool's detection state.
gcode:
    {% set tc = printer.toolchanger %}
    RESPOND TYPE=echo MSG='toolchanger: status={tc.status} tool_number={tc.tool_number} detected_tool={tc.detected_tool}'
    {% for tool_name in tc.tool_names %}
      {% set t = printer[tool_name] %}
      RESPOND TYPE=echo MSG='{tool_name}: detect_state={t.detect_state} active={t.active}'
    {% endfor %}

#####################################################################
#   TOOLCHANGE_SAFE_MOVE
#####################################################################
# Moves the gantry clear of the print/bed before any tool selection or
# dropoff happens. Hooked into [toolchanger]'s before_change_gcode
# (toolchanger.cfg), which runs once per SELECT_TOOL/UNSELECT_TOOL/T-command
# call, before that tool's dropoff_gcode and before the new tool's
# pickup_gcode -- so this always runs first, whichever direction the
# change is going. Z is left alone; Y moves before X.

[gcode_macro TOOLCHANGE_SAFE_MOVE]
description: Move to a safe XY position before a tool change. Usage: TOOLCHANGE_SAFE_MOVE [X=<pos>] [Y=<pos>]
gcode:
    {% set x = params.X | default(150) | float %}
    {% set y = params.Y | default(150) | float %}
    {% set speed = printer.toolchanger.params_fast_speed | default(3000) | float %}
    G90
    G0 Y{y} F{speed}
    G0 X{x} F{speed}

