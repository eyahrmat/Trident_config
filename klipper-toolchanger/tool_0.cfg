#####################################################################
#   Tool 0 - Toolchanger definition
#####################################################################
# T0 runs on its own dedicated board (nhk1), mirroring nhk's pin layout --
# see [extruder], [tmc2209 extruder], [fan_generic part_fan_t0],
# [heater_fan hotend_fan], [neopixel th_leds_t0], and the Orbiter Smart
# Sensor's [filament_switch_sensor smart_sensor_t0] / [gcode_button
# smart_sensor_button_t0] in klipper-toolchanger/toolboard_0.cfg for the
# underlying hardware.
#
# Extruder swapped to an LDO Orbiter v2.5 -- the mount/nozzle position may
# have shifted versus the old extruder, so re-check/re-run T0's nozzle
# offset calibration against T1 before trusting a multi-tool print.

[tool T0]
tool_number: 0
extruder: extruder
fan: part_fan_t0
## Maxwell coupling: tool-attach detection, same polarity caveat as T1 --
## verify once Klipper starts; add ^ or ! if it reads backwards.
detection_pin: nhk1:gpio13
## Offsets are handled by the tool change macro; keep these at 0.
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0

## Docking parameters -- measured on this printer's actual dock. Y stops
## (safe_toolhead_y/safe_shuttle_y/close_y/attach_y) are inherited from
## [toolchanger] since T0's dock shares the same Y geometry as T1's.
## Verify with a reduced-speed TEST_TOOL_DOCKING before running at full
## params_fast_speed/params_path_speed or calling DOCK_SEQUENCE.
params_park_x: 86    # X position with the toolhead screws fully within the docking slots.
params_detach_x: 91  # X position with the toolhead screws safely outside of the docking slots.

## Input shaper is not calibrated for the Orbiter toolhead.
## Run SHAPER_CALIBRATE CHIP="adxl345 nhk1" and add the measured
## params_input_shaper_type_x/y and params_input_shaper_freq_x/y here.
