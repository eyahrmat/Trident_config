#####################################################################
#   Tool 0 - Toolchanger definition
#####################################################################
# T0 runs on the existing nhk (Nitehawk) toolhead board -- see [extruder],
# [tmc2209 extruder], [fan_generic part_fan_t0], [heater_fan hotend_fan],
# and [neopixel th_leds_t0] in printer.cfg for the underlying hardware.
#
# No [gcode_macro T0] here -- tool_number: below auto-registers the T0
# command (and M106/M107, via fan:) directly in the toolchanger plugin.

[tool T0]
tool_number: 0
extruder: extruder
fan: part_fan_t0
## Maxwell coupling: tool-attach detection (triggered = absent, not
## triggered = present -- see klipper-toolchanger's toolchanger.md).
## Verify this polarity once Klipper starts; add ^ or ! if it reads backwards.
detection_pin: nhk:gpio13
## Offsets are handled by the tool change macro; keep these at 0.
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0

## Docking parameters -- measured on this printer's actual dock. Only exercised
## when a real pickup/dropoff runs (never happens with a single, always-mounted
## tool). Verify with a reduced-speed TEST_TOOL_DOCKING before wiring up a
## second tool head or running at full params_fast_speed/params_path_speed.
params_park_x: 7     # X position with the toolhead screws fully within the docking slots.
params_detach_x: 12   # X position with the toolhead screws safely outside of the docking slots.

## Input shaper parameters -- carried over from the current SAVE_CONFIG calibration
## in printer.cfg (mzv, x=66.4, y=46.2). Re-run SHAPER_CALIBRATE if that changes.
params_input_shaper_type_x: '2hump_ei'
params_input_shaper_freq_x: 101.2
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 47.6

