#####################################################################
#   Tool 0 - Toolchanger definition
#####################################################################
# T0 runs on the existing nhk (Nitehawk) toolhead board -- see [extruder],
# [tmc2209 extruder], [fan_generic part_fan_t0], [heater_fan hotend_fan],
# and [neopixel th_leds_t0] in printer.cfg for the underlying hardware.

[gcode_macro T0]
variable_color: ""
variable_tool_number: 0
gcode:
  _CHANGE_TOOL T={tool_number}

[tool T0]
tool_number: 0
extruder: extruder
## Fan control is handled by the tool change macro (M106/M107 overrides), not needed here.
## Offsets are handled by the tool change macro; keep these at 0.
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0

## Docking parameters -- PLACEHOLDERS, do not match this printer's dock yet.
## Only used when a real pickup/dropoff runs (never happens with a single,
## always-mounted tool). Measure and update before wiring up a second tool head.
params_park_x: -1000     # X position with the toolhead screws fully within the docking slots.
params_detach_x: -1000   # X position with the toolhead screws safely outside of the docking slots.

## Input shaper parameters -- carried over from the current SAVE_CONFIG calibration
## in printer.cfg (mzv, x=66.4, y=46.2). Re-run SHAPER_CALIBRATE if that changes.
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 66.4
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 46.2

[tool_probe T0]
## Maxwell coupling switch -- tool-attach detection / crash detection.
## Not used as a bed probe; Beacon remains the Z probe and leveling source.
pin: nhk:gpio13
tool: 0
z_offset: 0
speed: 2.0
lift_speed: 5.0
samples: 1
